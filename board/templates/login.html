<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 음악 공유 커뮤니티</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }
        .login-container {
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .logo {
            font-size: 28px;
            color: #333;
            margin-bottom: 30px;
            font-weight: bold;
        }
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .form-group {
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e1e1;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }
        .form-group input:focus {
            border-color: #4CAF50;
            outline: none;
        }
        .login-button {
            background-color: #4CAF50;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
            margin-top: 10px;
        }
        .login-button:hover {
            background-color: #45a049;
            transform: translateY(-2px);
        }
        .signup-link {
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }
        .signup-link a {
            color: #4CAF50;
            text-decoration: none;
            font-weight: bold;
        }
        .signup-link a:hover {
            text-decoration: underline;
        }
        .error-message {
            color: #ff4444;
            background-color: #ffebee;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .social-login {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        .social-login-title {
            color: #666;
            font-size: 14px;
            margin-bottom: 15px;
        }
        .social-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .social-button {
            padding: 10px 20px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background-color: white;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .social-button:hover {
            background-color: #f5f5f5;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">🎵 음악 공유 커뮤니티</div>
        <div class="error-message" id="errorMessage">
            아이디 또는 비밀번호가 올바르지 않습니다.
        </div>
        <form class="login-form" action="/customer/login" method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">아이디</label>
                <input type="text" id="username" name="username" placeholder="아이디를 입력하세요" required>
            </div>
            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요" required>
            </div>
            <button type="submit" class="login-button">로그인</button>
        </form>
        <div class="signup-link">
            아직 계정이 없으신가요? <a href="/customer/signup">회원가입</a>
        </div>
        <div class="social-login">
            <div class="social-login-title">소셜 계정으로 로그인</div>
            <div class="social-buttons">
                <button class="social-button">Google</button>
                <button class="social-button">Kakao</button>
                <button class="social-button">Naver</button>
            </div>
        </div>
    </div>

    <script>
        // 에러 메시지 표시 함수
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
        }

        // URL 파라미터에서 에러 메시지 확인
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        if (error) {
            showError(decodeURIComponent(error));
        }
    </script>
</body>
</html>
